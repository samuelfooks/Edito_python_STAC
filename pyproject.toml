[project]
name = "parquet-explorer"
version = "0.1.0"
description = "Interactive parquet file explorer with DuckDB and Lonboard"
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "matplotlib>=3.7.0",
    "contextily>=1.4.0",
    "shapely>=2.0.0",
    "duckdb>=0.9.0",
    "lonboard>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.5",
    "pystac-client>=0.8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

